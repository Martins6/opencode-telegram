name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist

          OS_ARCH=( "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" )

          for pair in "${OS_ARCH[@]}"; do
            OS="${pair%/*}"
            ARCH="${pair#*/}"

            OUTPUT_NAME="acolyte_${OS}_${ARCH}"

            echo "Building for ${OS}/${ARCH}..."

            if [ "$OS" = "windows" ]; then
              OUTPUT_NAME="${OUTPUT_NAME}.exe"
            fi

            GOOS=$OS GOARCH=$ARCH go build -ldflags="-s -w -X main.Version=${VERSION}" -o "dist/${OUTPUT_NAME}" .
          done

      - name: Create archives
        run: |
          cd dist
          for f in acolyte_*; do
            archive="${f}.tar.gz"
            mv "$f" "acolyte"
            tar -czf "$archive" "acolyte"
            mv "acolyte" "$f"
          done
          ls -la

      - name: Generate checksums
        run: |
          cd dist
          sha256sum acolyte_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/acolyte_linux_amd64.tar.gz
            dist/acolyte_linux_arm64.tar.gz
            dist/acolyte_darwin_amd64.tar.gz
            dist/acolyte_darwin_arm64.tar.gz
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TAG_TOKEN }}
